<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>67 Match</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #0d0f14;
            --dot: #1f2430;
            --box: #1a1e27;
            --box-border: #343b4b;
            --handle: #242a36;
            --text: #eef1f7;
            --muted: #8b94a8;
            --display: #0f1218;
            --op: #3b4a78;
            --op-hover: #4a5c94;
            --accent: #3ddc97;
            --accent-text: #08130e;
            box-sizing: border-box;
        }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background-color: var(--page);
            background-image: radial-gradient(var(--dot) 1px, transparent 1px);
            background-size: 22px 22px;
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .box {
            width: 100%;
            max-width: 560px;
            background: var(--box);
            border: 2px solid var(--box-border);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        .handle {
            padding: 12px 16px;
            background: var(--handle);
            border-bottom: 2px solid var(--box-border);
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .body { padding: 20px; }
        label {
            display: block;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 0.95rem;
            font-weight: 600;
        }
        input, button {
            box-sizing: border-box;
            font-size: 1.7rem;
            text-align: center;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }
        input {
            background: var(--display);
            color: var(--text);
            border: 2px solid var(--box-border);
            border-radius: 12px;
        }
        #input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
        }
        #input:focus { outline: none; border-color: var(--accent); }
        #input::placeholder { color: var(--muted); }

        .equation {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 8px;
        }
        .equation input {
            flex: 1 1 0;
            min-width: 0;
            padding: 14px 4px;
        }
        .equation input[readonly] { cursor: default; }
        .equation input:focus { outline: none; }

        .equation .op {
            flex: 0 0 52px;
            padding: 0;
            background: var(--op);
            border: 2px solid var(--op);
            border-radius: 12px;
            color: var(--text);
            font-weight: 600;
        }
        button.op {
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s, transform 0.06s;
        }
        button.op:hover { background: var(--op-hover); border-color: var(--op-hover); }
        button.op:active { transform: scale(0.94); }
        button.op:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

        .equation input.result {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-text);
            font-weight: 700;
        }
        .equation input.result:focus { border-color: var(--text); }

        input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div class="box">
        <div class="handle">67 Match</div>
        <div class="body">
            <label for="input">Input any number</label>
            <input oninput="findMatch()" type="number" value="" id="input" placeholder="0">
            <div class="equation">
                <input readonly value="" id="one" aria-label="Your number">
                <button type="button" class="op" id="op" onclick="nextop()" aria-label="Change operator" title="Click to change operator">+</button>
                <input readonly value="" id="two" aria-label="Number needed">
                <input readonly value="=" class="op" aria-hidden="true" tabindex="-1">
                <input oninput="findMatch()" type="number" value="67" class="result" aria-label="Target" id="goal">
            </div>
        </div>
    </div>
    <script>
        const input = document.getElementById("input");
        const one = document.getElementById("one");
        const two = document.getElementById("two");
        const op = document.getElementById("op");
        const goal = document.getElementById("goal");

        const ops = [
            { symbol: "+", solve: function (a, g) { return g - a; } },
            { symbol: "−", solve: function (a, g) { return a - g; } },
            { symbol: "×", solve: function (a, g) { return g / a; } },
            { symbol: "÷", solve: function (a, g) { return a / g; } }
        ];
        let opIndex = 0;

        function findMatch() {
            if (input.value === "") {
                one.value = "";
                two.value = "";
                return;
            }
            one.value = input.value;
            if (goal.value === "") {
                two.value = "";
                return;
            }
            const result = ops[opIndex].solve(Number(input.value), Number(goal.value));
            two.value = Number.isFinite(result) ? Math.round(result * 1e10) / 1e10 : "—";
        }

        function nextop() {
            opIndex = (opIndex + 1) % ops.length;
            op.textContent = ops[opIndex].symbol;
            findMatch();
        }
    </script>
</body>
</html>
